<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;fill:#C8A96E;letter-spacing:3px;text-transform:uppercase}
      .title{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:27px;fill:#F5F0EB}
      .label{font-family:'Hanken Grotesk','Helvetica Neue',sans-serif;font-size:12px;fill:#A09890;letter-spacing:1px}
      .label-gold{font-family:'Hanken Grotesk','Helvetica Neue',sans-serif;font-size:12px;fill:#F5F0EB;letter-spacing:1px}
      .mono{font-family:'JetBrains Mono','SF Mono',monospace;font-size:10.5px;fill:#A09890}
      .caption{font-family:'JetBrains Mono',monospace;font-size:10px;fill:#635D57;letter-spacing:2px;text-transform:uppercase}
    </style>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8A96E" stop-opacity="0.55"/><stop offset="100%" stop-color="#C8A96E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#161210" stop-opacity="1"/><stop offset="100%" stop-color="#0A0806" stop-opacity="1"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C8A96E"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#ambient)"/>

  <text x="60" y="42" class="kicker">DOCTRINE OVERLAY</text>
  <text x="60" y="72" class="title">Five golden layers, applied in place</text>

  <!-- divider -->
  <line x1="600" y1="105" x2="600" y2="345" stroke="#A09890" stroke-width="1" opacity="0.15"/>

  <!-- LEFT: plain repo -->
  <g transform="translate(230,225)">
    <text y="-95" text-anchor="middle" class="label">BEFORE</text>
    <rect x="-95" y="-70" width="190" height="140" rx="8" fill="none" stroke="#5B564F" stroke-width="2"/>
    <g fill="none" stroke="#5B564F" stroke-width="1.4">
      <rect x="-70" y="-45" width="140" height="18" rx="3"/>
      <rect x="-70" y="-18" width="140" height="18" rx="3"/>
      <rect x="-70" y="9" width="140" height="18" rx="3"/>
      <rect x="-70" y="36" width="90" height="18" rx="3"/>
    </g>
    <text y="95" text-anchor="middle" class="mono" fill="#5B564F">plain repository</text>
  </g>

  <!-- arrow with overlay script -->
  <g transform="translate(600,225)">
    <path d="M-140,-4 H130" stroke="#C8A96E" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text y="-18" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#C8A96E">apply-overlay.sh</text>
  </g>

  <!-- RIGHT: fortified repo, 5 golden layers -->
  <g transform="translate(940,225)">
    <text y="-95" text-anchor="middle" class="label-gold">AFTER</text>
    <circle r="105" fill="url(#glow)" opacity="0.35"/>
    <!-- 5 stacked layered rounded rects, offset to suggest depth -->
    <rect x="-92" y="-72" width="184" height="144" rx="10" fill="#141210" stroke="#5D4E2E" stroke-width="1.6" opacity="0.9"/>
    <rect x="-84" y="-64" width="168" height="128" rx="9" fill="#151210" stroke="#7A6438" stroke-width="1.6" opacity="0.92"/>
    <rect x="-76" y="-56" width="152" height="112" rx="8" fill="#161311" stroke="#9A7E45" stroke-width="1.7" opacity="0.95"/>
    <rect x="-68" y="-48" width="136" height="96" rx="7" fill="#171412" stroke="#B8964F" stroke-width="1.8"/>
    <rect x="-60" y="-40" width="120" height="80" rx="6" fill="#181513" stroke="#C8A96E" stroke-width="2.2"/>
    <g fill="none" stroke="#C8A96E" stroke-width="1.4" opacity="0.9">
      <rect x="-40" y="-22" width="80" height="14" rx="3"/>
      <rect x="-40" y="-2" width="80" height="14" rx="3"/>
      <rect x="-40" y="18" width="55" height="14" rx="3"/>
    </g>
    <text y="95" text-anchor="middle" class="mono" fill="#C8A96E">fortified repository</text>
  </g>

  <!-- layer legend -->
  <g transform="translate(60,300)" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#A09890" letter-spacing="0.5">
    <text y="0" fill="#C8A96E" letter-spacing="1.5">5 LAYERS</text>
    <text y="16">proof · guardrails · audit · gates · doctrine</text>
  </g>

  <line x1="60" y1="358" x2="1140" y2="358" stroke="#A09890" stroke-width="1" opacity="0.12"/>
  <text x="60" y="380" class="caption">one script, five layers of governed behavior</text>
</svg>
